name: Backend CI/CD

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/car-rental-backend:latest" \
            ./backend

          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/car-rental-backend:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > key.pem
          chmod 400 key.pem

          ssh -o StrictHostKeyChecking=accept-new -i key.pem \
            "$EC2_USER@$EC2_HOST" "
              docker pull $DOCKERHUB_USERNAME/car-rental-backend:latest
              docker stop car-rental-backend 2>/dev/null || true
              docker rm car-rental-backend 2>/dev/null || true
              docker run -d \
                --name car-rental-backend \
                --restart always \
                -p 3000:3000 \
                $DOCKERHUB_USERNAME/car-rental-backend:latest
            "

          rm -f key.pem